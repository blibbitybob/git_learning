<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #1c1917;
      background: #f6f1e7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      width: 100%;
      max-width: 36rem;
      background: #fffdf8;
      border: 1px solid #e7dfd2;
      border-radius: 12px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 12px 30px rgba(60, 40, 20, 0.06);
    }
    p.kicker {
      margin: 0 0 0.75rem;
      font-family: "Segoe UI", sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a3412;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2.25rem;
      line-height: 1.15;
      font-weight: normal;
    }
    p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.6;
      color: #44403c;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Django</p>
    <h1>Hello from my project</h1>
    <p>This is a simple page served by the pages app. Edit the template in <code>pages/templates/pages/home.html</code> to change what you see here.</p>
  </main>
</body>
</html>
